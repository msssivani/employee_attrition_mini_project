
# lab7-9 simple pipeline

data:
  raw_path: data/raw/WA_Fn-UseC_-HR-Employee-Attrition.csv
  processed_dir: data/processed
  target_column: Attrition
  id_column: EmployeeNumber

split:
  test_size: 0.2
  random_state: 42

model:
  C: 1.0
  kernel: rbf
  class_weight: balanced
  probability: true
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42

mlflow:
  tracking_uri: ""
  experiment_name: employee_attrition_model_training_lab7

registry:
  model_name: Employee_Attrition_Production_Model
  decision_metric: recall

quality_gate:
  metric: recall
  minimum_value: 0.65

lab9:
  repetitions: 3

paths:
  preprocessor: models/preprocessor.pkl
  model: models/best_model.pkl
  evaluation_report: reports/evaluation_report.json
  quality_gate_report: reports/quality_gate_report.json
  failure_report: reports/failure_report.json
  inference_output: outputs/inference_predictions.csv
